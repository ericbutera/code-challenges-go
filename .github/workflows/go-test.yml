name: Go

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: 1.25.1

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v8
              with:
                  version: v2.4.0
                  args: --timeout=5m --config=.golangci.yaml
                  only-new-issues: true

            - name: Test
              run: go test -v ./...
